AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: WhatsApp Tracker - batch GCLID enrichment cron Lambda

Parameters:
  ApiSecret:
    Type: String
    NoEcho: true
    Description: Shared bearer secret for machine-to-machine API endpoints
  BatchEnrichmentApiUrl:
    Type: String
    Description: Base URL of the deployed Next.js app (e.g. https://tracker.example.com)

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures:
      - x86_64
    Timeout: 30

Resources:
  EnrichBatchLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/enrich-batch-cron
      RetentionInDays: 30

  EnrichBatchCronFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: enrich-batch-cron
      Handler: enrich-batch/handler.handler
      CodeUri: ./
      Description: Calls POST /api/lambda/enrich-batch twice daily to enrich leads with GCLID data
      Policies:
        - AWSLambdaBasicExecutionRole
      Environment:
        Variables:
          API_SECRET: !Ref ApiSecret
          BATCH_ENRICHMENT_API_URL: !Ref BatchEnrichmentApiUrl
    DependsOn: EnrichBatchLogGroup

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeLambdaPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt EnrichBatchCronFunction.Arn

  MiddaySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: enrich-batch-midday
      Description: Trigger batch enrichment at 12:00 BRT daily
      ScheduleExpression: "cron(0 12 * * ? *)"
      ScheduleExpressionTimezone: "America/Sao_Paulo"
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt EnrichBatchCronFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn

  EndOfDaySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: enrich-batch-end-of-day
      Description: Trigger batch enrichment at 23:59 BRT daily
      ScheduleExpression: "cron(59 23 * * ? *)"
      ScheduleExpressionTimezone: "America/Sao_Paulo"
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt EnrichBatchCronFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn

Outputs:
  FunctionArn:
    Description: ARN of the enrich-batch-cron Lambda function
    Value: !GetAtt EnrichBatchCronFunction.Arn
  FunctionName:
    Description: Name of the enrich-batch-cron Lambda function
    Value: !Ref EnrichBatchCronFunction

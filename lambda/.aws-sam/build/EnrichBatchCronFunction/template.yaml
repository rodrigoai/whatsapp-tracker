AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: WhatsApp Tracker — batch GCLID enrichment cron Lambda

Parameters:
  ApiSecret:
    Type: String
    NoEcho: true
    Description: Shared bearer secret for machine-to-machine API endpoints
  BatchEnrichmentApiUrl:
    Type: String
    Description: Base URL of the deployed Next.js app (e.g. https://tracker.example.com)

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures:
      - x86_64
    Timeout: 30

Resources:
  EnrichBatchLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/enrich-batch-cron
      RetentionInDays: 30

  EnrichBatchCronFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: enrich-batch-cron
      Handler: enrich-batch/handler.handler
      CodeUri: ./
      Description: Calls POST /api/lambda/enrich-batch twice daily to enrich leads with GCLID data
      Policies:
        - AWSLambdaBasicExecutionRole
      Environment:
        Variables:
          API_SECRET: !Ref ApiSecret
          BATCH_ENRICHMENT_API_URL: !Ref BatchEnrichmentApiUrl
      Events:
        MiddaySchedule:
          Type: Schedule
          Properties:
            Name: enrich-batch-midday
            Description: Trigger batch enrichment at 12:00 BRT (15:00 UTC) daily
            Schedule: cron(0 15 * * ? *)
            Enabled: true
        EndOfDaySchedule:
          Type: Schedule
          Properties:
            Name: enrich-batch-end-of-day
            Description: Trigger batch enrichment at 23:59 BRT (02:59 UTC) daily
            Schedule: cron(59 2 * * ? *)
            Enabled: true
    DependsOn: EnrichBatchLogGroup

Outputs:
  FunctionArn:
    Description: ARN of the enrich-batch-cron Lambda function
    Value: !GetAtt EnrichBatchCronFunction.Arn
  FunctionName:
    Description: Name of the enrich-batch-cron Lambda function
    Value: !Ref EnrichBatchCronFunction
